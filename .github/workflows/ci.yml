name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          # Matches [tool.mypy] python_version in pyproject.toml. The
          # package itself supports >=3.11 (requires-python); 3.12 is the
          # one version CI pins so mypy's target and the CI runtime agree.
          python-version: "3.12"
      - run: uv sync --extra dev --extra topology
      - run: uv run pytest -q
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy .
