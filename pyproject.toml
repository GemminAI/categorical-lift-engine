[project]
name = "categorical-lift-engine"
version = "0.1.0"
description = "Categorical Lift Engine (CLE) — SensOS's Knowledge Generation engine: StabilizedTrajectory -> HEKB commit candidates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Gemmina Intelligence LLC." }]
keywords = [
    "categorical-lift-engine",
    "knowledge-crystallization",
    "category-theory",
    "hekb",
    "sensos",
    "gemminai",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/GemminAI/categorical-lift-engine"
Documentation = "https://github.com/GemminAI/categorical-lift-engine#readme"
Repository = "https://github.com/GemminAI/categorical-lift-engine"
"Upstream (OSS)" = "https://github.com/GemminAI/meaning-space-runtime"
"Sibling (OSS)" = "https://github.com/GemminAI/meaning-mapper"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["cle"]

[tool.hatch.build.targets.wheel.force-include]
"src/cle" = "cle"

[tool.hatch.build.targets.sdist]
include = [
  "src/cle",
  "docs",
  "tests",
  "LICENSE",
  "NOTICE",
  "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v --tb=short --cov=cle --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["cle"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N818: CLEError subclasses are the domain's vocabulary (NotStabilized, RawObservationRejected,
# NoStrategyConfigured); an Error suffix on every one reads worse, and CLEError already marks
# the base — same convention as msr.errors in meaning-space-runtime.
ignore = ["N818"]
